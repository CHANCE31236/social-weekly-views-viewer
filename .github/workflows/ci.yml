name: Regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install "openpyxl>=3.1,<4" "Pillow>=10.4,<13"
      - run: python -m unittest discover -s tests -v
